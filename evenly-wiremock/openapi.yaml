openapi: 3.0.3
info:
  title: Evenly API
  version: 1.0.0
  description: Shared Expense Tracker API - Mobile-First Expense Splitting Application
  contact:
    name: Evenly Team

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.evenly.app
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication and user management
  - name: Workspaces
    description: Workspace management
  - name: Categories
    description: Category management
  - name: Expenses
    description: Expense tracking
  - name: Payments
    description: Payment management
  - name: Balance
    description: Balance and settlement
  - name: Analytics
    description: Analytics and reporting
  - name: Invites
    description: Workspace invitations
  - name: Notifications
    description: User notifications
  - name: Currencies
    description: Currency information

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/user/me:
    get:
      tags:
        - Auth
      summary: Get current user
      description: Returns the currently authenticated user's information
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/workspaces:
    get:
      tags:
        - Workspaces
      summary: List workspaces
      description: Returns all workspaces the current user has access to
      responses:
        '200':
          description: List of workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
    post:
      tags:
        - Workspaces
      summary: Create workspace
      description: Creates a new workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '200':
          description: Created workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/workspaces/{workspaceId}:
    get:
      tags:
        - Workspaces
      summary: Get workspace
      description: Returns a specific workspace by ID
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    $ref: '#/components/schemas/Workspace'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Workspaces
      summary: Update workspace
      description: Updates workspace details
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    $ref: '#/components/schemas/Workspace'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Workspaces
      summary: Delete workspace
      description: Deletes a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '204':
          description: Workspace deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/workspaces/{workspaceId}/settings:
    put:
      tags:
        - Workspaces
      summary: Update workspace settings
      description: Updates workspace settings
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceSettingsRequest'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    $ref: '#/components/schemas/Workspace'

  /api/workspaces/{workspaceId}/members:
    get:
      tags:
        - Workspaces
      summary: List workspace members
      description: Returns all members of a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceMember'

  /api/workspaces/{workspaceId}/members/weights:
    put:
      tags:
        - Workspaces
      summary: Update member weights
      description: Updates the weight percentages for workspace members
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberWeightsRequest'
      responses:
        '200':
          description: Weights updated successfully

  /api/workspaces/{workspaceId}/balance:
    get:
      tags:
        - Balance
      summary: Get workspace balance
      description: Returns the balance for all members in a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Balance information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Balance'

  /api/workspaces/{workspaceId}/settle-up:
    get:
      tags:
        - Balance
      summary: Get settle-up information
      description: Returns settle-up information showing who owes what
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Settle-up information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SettleUpResponse'

  /api/workspaces/{workspaceId}/settlements:
    get:
      tags:
        - Balance
      summary: List settlements
      description: Returns all settlements for a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: List of settlements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Settlement'
    post:
      tags:
        - Balance
      summary: Create settlement
      description: Creates a new settlement for a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSettlementRequest'
      responses:
        '200':
          description: Created settlement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Settlement'

  /api/workspaces/{workspaceId}/invites:
    post:
      tags:
        - Invites
      summary: Create invite
      description: Creates a new invitation for a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '200':
          description: Created invite
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Invite'

  /api/workspaces/{workspaceId}/expenses:
    get:
      tags:
        - Expenses
      summary: List expenses
      description: Returns paginated list of expenses for a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Paginated list of expenses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExpenses'
    post:
      tags:
        - Expenses
      summary: Create expense
      description: Creates a new expense in a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '200':
          description: Created expense
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Expense'

  /api/workspaces/{workspaceId}/expenses/{expenseId}:
    get:
      tags:
        - Expenses
      summary: Get expense
      description: Returns a specific expense by ID
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        '200':
          description: Expense details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Expense'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Expenses
      summary: Update expense
      description: Updates an existing expense
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ExpenseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpenseRequest'
      responses:
        '200':
          description: Updated expense
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Expense'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Expenses
      summary: Delete expense
      description: Deletes an expense
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        '204':
          description: Expense deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /api/workspaces/{workspaceId}/categories:
    get:
      tags:
        - Categories
      summary: List workspace categories
      description: Returns all categories for a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
    post:
      tags:
        - Categories
      summary: Create category
      description: Creates a new category in a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '200':
          description: Created category
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'

  /api/workspaces/{workspaceId}/categories/{categoryId}:
    get:
      tags:
        - Categories
      summary: Get category
      description: Returns a specific category by ID
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Categories
      summary: Update category
      description: Updates an existing category
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Categories
      summary: Delete category
      description: Deletes (disables) a category
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Category deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /api/workspaces/{workspaceId}/analytics/balance-summary:
    get:
      tags:
        - Analytics
      summary: Get balance summary
      description: Returns balance summary analytics for a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Balance summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSummary'

  /api/workspaces/{workspaceId}/analytics/expenses-snapshot:
    get:
      tags:
        - Analytics
      summary: Get expenses snapshot
      description: Returns expense snapshot by category
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: size
          in: query
          description: Maximum number of categories to return (0 = all)
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Expenses snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSnapshotResponse'

  /api/workspaces/{workspaceId}/analytics/recent-expenses:
    get:
      tags:
        - Analytics
      summary: Get recent expenses
      description: Returns recent expenses for a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: size
          in: query
          description: Number of recent expenses to return
          required: false
          schema:
            type: integer
            minimum: 1
            default: 5
      responses:
        '200':
          description: Recent expenses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Expense'

  /api/workspaces/{workspaceId}/payments:
    get:
      tags:
        - Payments
      summary: List payments
      description: Returns paginated list of payments for a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: status
          in: query
          description: Filter by payment status
          required: false
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Paginated list of payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPayments'

  /api/workspaces/{workspaceId}/pay:
    post:
      tags:
        - Payments
      summary: Create payment
      description: Creates a new payment in a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '200':
          description: Created payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/workspaces/{workspaceId}/payments/{paymentId}:
    get:
      tags:
        - Payments
      summary: Get payment
      description: Returns a specific payment by ID
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Payments
      summary: Update payment
      description: Updates an existing payment
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentRequest'
      responses:
        '200':
          description: Updated payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Payments
      summary: Delete payment
      description: Deletes a payment
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Payment deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/categories:
    get:
      tags:
        - Categories
      summary: List global categories
      description: Returns all global categories (not workspace-specific)
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
    post:
      tags:
        - Categories
      summary: Create global category
      description: Creates a new global category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '200':
          description: Created category
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'

  /api/categories/{categoryId}:
    get:
      tags:
        - Categories
      summary: Get category
      description: Returns a specific category by ID
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Categories
      summary: Update category
      description: Updates an existing category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Categories
      summary: Delete category
      description: Deletes (disables) a category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Category deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /api/invites/join:
    post:
      tags:
        - Invites
      summary: Join workspace via invite
      description: Joins a workspace using an invitation code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: Invitation code
      responses:
        '200':
          description: Successfully joined workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/currencies:
    get:
      tags:
        - Currencies
      summary: List currencies
      description: Returns all supported currencies
      security: []
      responses:
        '200':
          description: List of currencies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Currency'

  /api/notifications:
    get:
      tags:
        - Notifications
      summary: List notifications
      description: Returns all notifications for the current user
      responses:
        '200':
          description: List of notifications with unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  unreadCount:
                    type: integer
                    description: Total number of unread notifications

  /api/notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: Get unread count
      description: Returns the count of unread notifications
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count:
                        type: integer

  /api/notifications/{notificationId}/mark-as-read:
    post:
      tags:
        - Notifications
      summary: Mark notification as read
      description: Marks a specific notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Notification marked as read

  /api/notifications/mark-all-as-read:
    post:
      tags:
        - Notifications
      summary: Mark all notifications as read
      description: Marks all notifications as read for the current user
      responses:
        '204':
          description: All notifications marked as read

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak JWT token

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
      description: Workspace identifier
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
      description: Expense identifier
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
      description: Category identifier
    StartDate:
      name: startDate
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Start date for filtering (YYYY-MM-DD)
    EndDate:
      name: endDate
      in: query
      required: false
      schema:
        type: string
        format: date
      description: End date for filtering (YYYY-MM-DD)
    Status:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [ACTIVE, SETTLED, PENDING, COMPLETED]
      description: Filter by status
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Page number (0-indexed)
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: Sort specification (e.g., "effectiveDate,DESC")

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - Invalid or missing authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict - Resource cannot be deleted or modified
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        username:
          type: string
        avatarUrl:
          type: string
          format: uri
        preferredCurrency:
          type: string
        locale:
          type: string
        timezone:
          type: string
        createdAt:
          type: string
          format: date-time

    Workspace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        defaultSplitMode:
          type: string
          enum: [EQUAL, WEIGHTED]
        monthlySharedLimit:
          type: number
          nullable: true
        isPersonal:
          type: boolean
        currency:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkspaceMember:
      type: object
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [OWNER, MEMBER]
        weightPercent:
          type: number
        personalMonthlyLimit:
          type: number
          nullable: true
        user:
          $ref: '#/components/schemas/User'

    Category:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        color:
          type: string
        isActive:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Expense:
      type: object
      properties:
        id:
          type: string
        categoryId:
          type: string
          nullable: true
        categoryName:
          type: string
        categoryIcon:
          type: string
        categoryColor:
          type: string
        amount:
          type: number
        currency:
          type: string
        effectiveDate:
          type: string
          format: date
        note:
          type: string
        status:
          type: string
          enum: [ACTIVE, SETTLED]
        paidByUserId:
          type: string
        paidByUserName:
          type: string

    ExpenseParticipant:
      type: object
      properties:
        userId:
          type: string
        user:
          $ref: '#/components/schemas/User'

    Payment:
      type: object
      properties:
        id:
          type: string
        payeeUserId:
          type: string
        payeeUserName:
          type: string
        amount:
          type: number
        currency:
          type: string
        effectiveDate:
          type: string
          format: date
        note:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        paidByUserId:
          type: string
        paidByUserName:
          type: string

    PaymentStatus:
      type: string
      enum: [COMPLETED, PENDING, FAILED]

    Balance:
      type: object
      properties:
        userId:
          type: string
        paid:
          type: number
        expected:
          type: number
        balance:
          type: number
        user:
          $ref: '#/components/schemas/User'

    BalanceSummary:
      type: object
      properties:
        userTotalPaidAmount:
          type: number
        userTotalExpectedAmount:
          type: number
        workspaceTotalPaidAmount:
          type: number
        budgetLimit:
          type: number
          nullable: true
        spentPercentage:
          type: number
        currency:
          type: string

    ExpenseSnapshotResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseSnapshotItem'
        categoriesCount:
          type: integer
        remainingCategoriesCount:
          type: integer

    ExpenseSnapshotItem:
      type: object
      properties:
        categoryId:
          type: string
          nullable: true
        categoryName:
          type: string
        categoryIcon:
          type: string
        categoryColor:
          type: string
        totalAmount:
          type: number
        spentPercentage:
          type: number
        expensesCount:
          type: integer
          nullable: true

    Settlement:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/User'

    Transfer:
      type: object
      properties:
        id:
          type: string
        settlementId:
          type: string
        fromUserId:
          type: string
        toUserId:
          type: string
        amount:
          type: number
        fromUser:
          $ref: '#/components/schemas/User'
        toUser:
          $ref: '#/components/schemas/User'

    SettleUpResponse:
      type: object
      properties:
        currency:
          type: string
        currentUser:
          $ref: '#/components/schemas/SettleUpMember'
        otherMembers:
          type: array
          items:
            $ref: '#/components/schemas/SettleUpMember'

    SettleUpMember:
      type: object
      properties:
        userId:
          type: string
        userFullName:
          type: string
        paidAmount:
          type: number
        expectedAmount:
          type: number

    Invite:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        code:
          type: string
        maxUses:
          type: integer
        usesCount:
          type: integer
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        content:
          type: string
        timestamp:
          type: string
          format: date-time
        workspaceId:
          type: string
        read:
          type: boolean

    Currency:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        symbol:
          type: string

    CreateWorkspaceRequest:
      type: object
      required:
        - name
        - defaultSplitMode
      properties:
        name:
          type: string
        defaultSplitMode:
          type: string
          enum: [EQUAL, WEIGHTED]
        monthlySharedLimit:
          type: number
          nullable: true
        currency:
          type: string

    UpdateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
        defaultSplitMode:
          type: string
          enum: [EQUAL, WEIGHTED]
        monthlySharedLimit:
          type: number
          nullable: true

    UpdateWorkspaceSettingsRequest:
      type: object
      properties:
        name:
          type: string
        defaultSplitMode:
          type: string
          enum: [EQUAL, WEIGHTED]
        monthlySharedLimit:
          type: number
          nullable: true

    UpdateMemberWeightsRequest:
      type: object
      required:
        - weights
      properties:
        weights:
          type: array
          items:
            type: object
            required:
              - userId
              - weightPercent
            properties:
              userId:
                type: string
              weightPercent:
                type: number
              personalMonthlyLimit:
                type: number
                nullable: true

    CreateCategoryRequest:
      type: object
      required:
        - name
        - icon
      properties:
        name:
          type: string
        icon:
          type: string
        color:
          type: string

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        isActive:
          type: boolean
        sortOrder:
          type: integer

    CreateExpenseRequest:
      type: object
      required:
        - amount
        - categoryId
        - date
      properties:
        workspaceId:
          type: string
        amount:
          type: number
        categoryId:
          type: string
        date:
          type: string
          format: date
        note:
          type: string
        participantIds:
          type: array
          items:
            type: string

    UpdateExpenseRequest:
      type: object
      properties:
        amount:
          type: number
        paidByUserId:
          type: string
        categoryId:
          type: string
        date:
          type: string
          format: date
        note:
          type: string
        participantIds:
          type: array
          items:
            type: string

    CreatePaymentRequest:
      type: object
      required:
        - payeeUserId
        - amount
      properties:
        payeeUserId:
          type: string
        amount:
          type: number
        note:
          type: string
        effectiveDate:
          type: string
          format: date

    UpdatePaymentRequest:
      type: object
      properties:
        payeeUserId:
          type: string
        amount:
          type: number
        note:
          type: string
        effectiveDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/PaymentStatus'

    CreateInviteRequest:
      type: object
      required:
        - maxUses
      properties:
        maxUses:
          type: integer
        expiresInDays:
          type: integer

    CreateSettlementRequest:
      type: object
      properties:
        note:
          type: string

    PaginatedExpenses:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
        page:
          $ref: '#/components/schemas/PageInfo'
        sort:
          $ref: '#/components/schemas/SortInfo'

    PaginatedPayments:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        page:
          $ref: '#/components/schemas/PageInfo'
        sort:
          $ref: '#/components/schemas/SortInfo'

    PageInfo:
      type: object
      properties:
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    SortInfo:
      type: object
      properties:
        sorted:
          type: boolean
        direction:
          type: string
          enum: [ASC, DESC]
        property:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
