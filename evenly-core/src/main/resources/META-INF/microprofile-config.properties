server.port=8080
server.host=0.0.0.0
mp.openapi.extensions.enabled=true
mp.openapi.servers.relative.urls=/openapi
mp.openapi.format=JSON
mp.openapi.path=/openapi
mp.openapi.ui.path=/openapi/ui
# Disable MicroProfile Security extension (using custom AuthFilter instead)
mp.security.enabled=false
# Suppress SnakeYAML introspection warnings (harmless - only affects YAML serialization, we use JSON)
logging.level.org.yaml.snakeyaml.introspector=ERROR
