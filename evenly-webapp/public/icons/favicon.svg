<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="25%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="75%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueAccent" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleAccent" cx="85%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealAccent" cx="15%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rectGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="circleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#10b981"/>
    </radialGradient>
    <radialGradient id="glassHighlight" cx="35%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rectShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="cornerAccent1" cx="0%" cy="0%" r="30%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerAccent2" cx="100%" cy="100%" r="30%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="subtlePattern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.02"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <!-- Base background with gradient -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <!-- Abstract color accents -->
  <rect width="128" height="128" rx="28" fill="url(#blueAccent)"/>
  <rect width="128" height="128" rx="28" fill="url(#purpleAccent)"/>
  <rect width="128" height="128" rx="28" fill="url(#tealAccent)"/>
  <!-- Subtle diagonal pattern overlay -->
  <rect width="128" height="128" rx="28" fill="url(#subtlePattern)"/>
  <!-- Corner accent - top left -->
  <rect width="128" height="128" rx="28" fill="url(#cornerAccent1)"/>
  <!-- Corner accent - bottom right -->
  <rect width="128" height="128" rx="28" fill="url(#cornerAccent2)"/>
  <!-- Emerald glow overlay for Liquid Glass effect -->
  <rect width="128" height="128" rx="28" fill="url(#emeraldGlow)"/>
  <!-- Glass highlight for depth -->
  <rect width="128" height="128" rx="28" fill="url(#glassHighlight)"/>
  <!-- Main white rectangle with gradient -->
  <rect x="20" y="40" width="88" height="48" rx="12" fill="url(#rectGrad)"/>
  <!-- Subtle shadow on rectangle -->
  <rect x="20" y="40" width="88" height="48" rx="12" fill="url(#rectShadow)"/>
  <!-- Emerald accent circle with gradient -->
  <circle cx="92" cy="64" r="9" fill="url(#circleGrad)"/>
</svg>