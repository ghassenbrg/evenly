services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evenly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evenly}
      POSTGRES_DB: ${POSTGRES_DB:-evenly}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - evenlydata:/var/lib/postgresql/data

  evenly-core:
    build: ./evenly-core
    environment:
      DB_URL: jdbc:postgresql://db:${DB_PORT:-5432}/${POSTGRES_DB:-evenly}
      DB_USER: ${DB_USER:-evenly}
      DB_PASSWORD: ${DB_PASSWORD:-evenly}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:9090}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-evenly}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-evenly-backend}
    depends_on:
      - db
    ports:
      - "${API_PORT:-8080}:8080"

  wiremock:
    build: ./evenly-wiremock
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - WIREMOCK_OPTIONS=${WIREMOCK_OPTIONS:---global-response-templating --verbose}
    profiles:
      - mock

  evenly-webapp:
    build: ./evenly-webapp
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080}
      NUXT_PUBLIC_KEYCLOAK_URL: ${NUXT_PUBLIC_KEYCLOAK_URL:-http://localhost:9090}
      NUXT_PUBLIC_KEYCLOAK_REALM: ${NUXT_PUBLIC_KEYCLOAK_REALM:-evenly}
      NUXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NUXT_PUBLIC_KEYCLOAK_CLIENT_ID:-evenly-web}
      NUXT_PUBLIC_POCKITO_API_BASE: ${NUXT_PUBLIC_POCKITO_API_BASE:-http://localhost:8080}
    ports:
      - "${WEBAPP_PORT:-3000}:3000"

volumes:
  evenlydata: {}
